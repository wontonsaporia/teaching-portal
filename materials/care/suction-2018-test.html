<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>喀痰吸引等研修｜テスト｜Teaching Portal</title><link rel="stylesheet" href="practice.css"></head>
<body data-mode="test"><header class="mast"><div class="shell mast-inner"><a class="brand" href="../../index.html">← Teaching Portal</a><span class="mode">EXAM MODE</span></div></header>
<div class="shell"><div class="hero"><div class="eyebrow">平成30年度後期・喀痰吸引等研修</div><h1>50問 模擬テスト</h1><p class="sub">50問を解答し、提出後に正答率・分野別成績・復習問題を確認できます。途中では正誤を表示しません。</p></div>
<div class="layout"><div class="surface maincard" id="screen">
<div class="statbar"><span class="topic" id="category"></span><span id="position"></span></div><div class="progress"><div id="progress"></div></div>
<h2 class="question-title" id="question"></h2><div class="diagram muted" id="diagram" hidden></div>
<div class="options" id="options"></div><div id="feedback" aria-live="polite"></div>
<div class="actions"><button class="btn ghost" id="prev" type="button">前の問題</button><button class="btn" id="next" type="button">次の問題へ</button></div>
<p class="muted" id="source-page"></p></div>
<div class="surface maincard result-page" id="report" hidden><span class="tag">RESULTS</span><h2 id="report-title"></h2><div class="score" id="score"></div><div class="metrics" id="metrics"></div>
<p class="notice" id="quality"></p><hr class="divider"><h3 class="section-title">分野別の正答率</h3><div id="weak"></div>
<h3 class="section-title">要復習の問題</h3><div class="misslist" id="wrong-list"></div><p class="details" id="review-dialog" hidden style="white-space:pre-wrap"></p>
<div class="actions"><button class="btn secondary" id="retry-wrong" type="button">間違えた問題を練習</button><button class="btn" id="restart" type="button">全50問をやり直す</button></div><button class="btn ghost" id="back" type="button">問題画面に戻る</button></div>
<aside class="surface side"><h2>学習メニュー</h2><p id="counter"></p><a href="suction-2018-quiz.html">練習ドリルへ切り替える</a>
<label class="muted" for="choice-order">選択肢の並び</label><select id="choice-order"><option value="original">原本の順序</option><option value="shuffled">ランダムに入れ替える</option></select>
<label class="muted" for="order">出題順</label><select id="order"><option value="ordered">原本順</option><option value="random">ランダム</option></select>
<div id="navigator" class="grid-numbers" aria-label="問題一覧"></div><button class="btn secondary" id="finish" type="button">テストを提出する</button>
<div class="utility"><button type="button" id="reset">このページの解答履歴を消去</button><a href="dashboard.html">学習ダッシュボード</a><a href="regulations.html">法令・正答の検証状況</a><a id="source" href="disclaimer.html">原本・利用上の注意</a></div>
</aside></div><nav class="secondary-links"><a href="disclaimer.html">教材の出典・免責事項</a><a href="../../index.html">教材一覧へ</a></nav></div>
